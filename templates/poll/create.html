{{define "title"}}Create Poll{{end}}

{{define "content"}}
<div class="poll-layout">
  <div class="profile-card">
    <h2>Create Poll</h2>

    {{if .Error}}
    <div class="alert alert-error">{{.Error}}</div>
    {{end}}

    <form method="POST" action="/polls/create" class="posting-form">
      <div class="form-group">
        <label for="question">Question</label>
        <textarea id="question" name="question" rows="3" placeholder="What would you like to ask?" required></textarea>
      </div>

      <div class="form-group">
        <label for="option1">Option 1 (required)</label>
        <input type="text" id="option1" name="option1" maxlength="255" required />
      </div>

      <div class="form-group">
        <label for="option2">Option 2 (required)</label>
        <input type="text" id="option2" name="option2" maxlength="255" required />
      </div>

      <div class="form-group">
        <label for="option3">Option 3</label>
        <input type="text" id="option3" name="option3" maxlength="255" />
      </div>

      <div class="form-group">
        <label for="option4">Option 4</label>
        <input type="text" id="option4" name="option4" maxlength="255" />
      </div>

      <div class="form-group">
        <label for="option5">Option 5</label>
        <input type="text" id="option5" name="option5" maxlength="255" />
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Create Poll</button>
        <a href="/polls" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{{end}}

{{template "base" .}}
