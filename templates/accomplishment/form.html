{{define "title"}}{{if .Accomplishment}}Edit Accomplishment{{else}}Add Accomplishment{{end}}{{end}}

{{define "content"}}
<div class="accomplishment-layout">
  <div class="profile-card">
    <h2>{{if .Accomplishment}}Edit Accomplishment{{else}}Add Accomplishment{{end}}</h2>

    {{if .Error}}
    <div class="alert alert-error">{{.Error}}</div>
    {{end}}

    <form method="POST" action="{{if .Accomplishment}}/accomplishments/{{.Accomplishment.ID}}/edit{{else}}/accomplishments/add{{end}}">
      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" value="{{if .Accomplishment}}{{.Accomplishment.Title}}{{end}}" required placeholder="e.g. Led Q1 Security Audit">
      </div>
      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="4" required placeholder="Describe what you accomplished and the impact it had...">{{if .Accomplishment}}{{.Accomplishment.Description}}{{end}}</textarea>
      </div>
      <div class="form-group">
        <label for="period_type">Period Type</label>
        <select id="period_type" name="period_type" required>
          <option value="">Select period...</option>
          <option value="quarterly"{{if and .Accomplishment (eq .Accomplishment.PeriodType "quarterly")}} selected{{end}}>Quarterly</option>
          <option value="yearly"{{if and .Accomplishment (eq .Accomplishment.PeriodType "yearly")}} selected{{end}}>Yearly</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="period_start">Period Start</label>
          <input type="date" id="period_start" name="period_start" value="{{if .Accomplishment}}{{.Accomplishment.PeriodStart.Format "2006-01-02"}}{{end}}" required>
        </div>
        <div class="form-group">
          <label for="period_end">Period End</label>
          <input type="date" id="period_end" name="period_end" value="{{if .Accomplishment}}{{.Accomplishment.PeriodEnd.Format "2006-01-02"}}{{end}}" required>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">{{if .Accomplishment}}Save Changes{{else}}Add Accomplishment{{end}}</button>
        <a href="/accomplishments" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{{end}}

{{template "base" .}}
