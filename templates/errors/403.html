<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>403 | Access Denied</title>
  <style>
    :root { --bg:#f3f6f8; --card:#ffffff; --ink:#12222f; --muted:#4a5a66; --line:#d7e0e6; --accent:#005ea2; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "Source Sans Pro", "Segoe UI", Arial, sans-serif; background:radial-gradient(circle at top right, #d9edf7, var(--bg)); color:var(--ink); }
    main { min-height:100vh; display:grid; place-items:center; padding:24px; }
    .card { width:min(760px, 100%); background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px; box-shadow:0 14px 36px rgba(12,38,57,0.12); }
    .code { font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent); font-weight:700; }
    h1 { margin:8px 0 10px; font-size:34px; }
    p { margin:0 0 10px; color:var(--muted); }
    .path { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background:#eef4f7; padding:8px 10px; border-radius:8px; color:#344b5c; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
    a { text-decoration:none; border-radius:10px; padding:10px 14px; border:1px solid var(--line); color:var(--ink); font-weight:600; }
    a.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-live="polite">
      <div class="code">Error 403</div>
      <h1>Access denied</h1>
      <p>You do not have permission to view this page, or your request failed a security check.</p>
      <div class="actions">
        <a class="primary" href="/feed">Go to feed</a>
        <a href="/login">Sign in again</a>
      </div>
    </section>
  </main>
</body>
</html>
