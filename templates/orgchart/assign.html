{{define "title"}}Assign Managers{{end}}

{{define "content"}}
<div class="orgchart-assign-layout">
    <div class="profile-card">
        <h2>Assign Managers</h2>
        {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
        <form method="POST" action="/admin/orgchart" data-orgchart-form>
            <div class="form-group">
                <label for="employee_id">Employee</label>
                <select id="employee_id" name="employee_id" required data-initial-value="">
                    <option value="">Select an employee…</option>
                    {{range .Users}}
                    <option value="{{.ID}}">{{.Name}}</option>
                    {{end}}
                </select>
            </div>
            <div class="form-group">
                <label for="manager_id">Reports To (Manager)</label>
                <select id="manager_id" name="manager_id" data-initial-value="">
                    <option value="">No manager (top of chart)</option>
                    {{range .Users}}
                    <option value="{{.ID}}">{{.Name}}</option>
                    {{end}}
                </select>
            </div>
            <p class="form-hint">An employee cannot be their own manager. Choosing "No manager" places them at the top of the chart.</p>
            <button type="submit" class="btn btn-primary" id="orgchart-submit" disabled>Save Reporting Relationship</button>
        </form>
        <a href="/orgchart" class="back-link orgchart-back-link">← Back to Org Chart</a>
    </div>
</div>
{{end}}

{{define "scripts"}}
<script>
document.addEventListener('DOMContentLoaded', function() {
  var form = document.querySelector('[data-orgchart-form]');
  if (!form) return;

  var employee = form.querySelector('#employee_id');
  var manager = form.querySelector('#manager_id');
  var submit = form.querySelector('#orgchart-submit');
  if (!employee || !manager || !submit) return;

  function syncState() {
    var hasEmployee = (employee.value || '').trim() !== '';
    var validPair = employee.value !== manager.value;
    submit.disabled = !(hasEmployee && validPair);
  }

  employee.addEventListener('change', syncState);
  employee.addEventListener('input', syncState);
  manager.addEventListener('change', syncState);
  manager.addEventListener('input', syncState);
  syncState();
});
</script>
{{end}}

{{template "base" .}}
