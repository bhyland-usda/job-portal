{{define "title"}}Join Now{{end}}

{{define "content"}}
<div class="auth-card">
  <h1>Join JobPortal</h1>
  <p class="subtitle">Make the most of your professional life</p>

  {{if .Error}}
  <div class="alert alert-error">{{.Error}}</div>
  {{end}}

  <form method="POST" action="/register">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div class="form-row">
      <div class="form-group">
        <label for="first_name">First Name</label>
        <input type="text" id="first_name" name="first_name" required autofocus>
      </div>
      <div class="form-group">
        <label for="last_name">Last Name</label>
        <input type="text" id="last_name" name="last_name" required>
      </div>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" minlength="8" required>
    </div>
    <button type="submit" class="btn btn-primary btn-full">Join</button>
  </form>
  <p class="auth-switch">Already on JobPortal? <a href="/login">Sign in</a></p>
</div>
{{end}}

{{template "base" .}}
