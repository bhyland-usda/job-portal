{{define "title"}}{{if .Article}}Edit Article{{else}}Write Article{{end}}{{end}}

{{define "content"}}
<div class="article-layout">
    <div class="profile-card">
        <h2>{{if .Article}}Edit Article{{else}}Write Article{{end}}</h2>
        {{if .Error}}
        <div class="alert alert-error">{{.Error}}</div>
        {{end}}
        <form method="POST" action="{{if .Article}}/articles/{{.Article.ID}}/edit{{else}}/articles/write{{end}}">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" value="{{if .Article}}{{.Article.Title}}{{end}}" required placeholder="Article title..." />
            </div>
            <div class="form-group">
                <label for="content">Content</label>
                <textarea id="content" name="content" rows="16" required placeholder="Write your article...">{{if .Article}}{{.Article.Content}}{{end}}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">{{if .Article}}Update{{else}}Publish{{end}}</button>
        </form>
    </div>
</div>
{{end}}

{{template "base" .}}
