{{define "title"}}Create Group{{end}}

{{define "content"}}
<div class="group-create-layout">
    <div class="profile-card">
        <h2>Create Interest Group</h2>

        {{if .Error}}
        <div class="error-message" style="color:var(--error);margin:12px 0;">{{.Error}}</div>
        {{end}}

        <form method="POST" action="/groups/create" style="margin-top:16px;">
            <div class="form-group" style="margin-bottom:16px;">
                <label for="name" style="display:block;font-weight:600;margin-bottom:4px;">Group Name</label>
                <input type="text" id="name" name="name" required
                    style="width:100%;padding:10px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;">
            </div>

            <div class="form-group" style="margin-bottom:16px;">
                <label for="description" style="display:block;font-weight:600;margin-bottom:4px;">Description</label>
                <textarea id="description" name="description" rows="4"
                    style="width:100%;padding:10px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;resize:vertical;font-family:inherit;"
                    placeholder="What is this group about?"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Create Group</button>
            <a href="/groups" class="btn" style="margin-left:8px;">Cancel</a>
        </form>
    </div>
</div>
{{end}}

{{template "base" .}}
