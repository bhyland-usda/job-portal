{{define "title"}}Create Posting{{end}}

{{define "content"}}
<div class="posting-layout">
  <div class="profile-card">
    <h2>Create Post</h2>

    {{if .Error}}
    <div class = "alert alert-error" role="alert">{{.Error}}</div>
    {{end}}

    <form method="POST" action="/postings/create" class="posting-form" enctype="multipart/form-data">
      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" required placeholder="e.g. Data Analyst for Forest Service Project" />
      </div>
      <div class="form-group">
        <label for="type">Type</label>
        <select id="type" name="type" required>
          <option value="">Select type...</option>
          <option value="project">Project</option>
          <option value="detail">Detail</option>
        </select>
      </div>
      <div class="form-group">
        <label for="department">Department</label>
        <input type="text" id="department" name="department" placeholder="e.g. NRCS, Forest Service" />
      </div>
      <div class="form-group">
        <label for="location">Location</label>
        <input type="text" id="location" name="location" placeholder="e.g. Washington, DC" />
      </div>
      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="6" required placeholder="Describe the project or detail..."></textarea>
      </div>
      <div class="form-group">
        <label for="skills">Required Skills</label>
        <input type="text" id="skills" name="skills" placeholder="e.g. Python, GIS, Data Analysis" aria-describedby="skills-hint" />
        <p class="form-hint" id="skills-hint">Comma-separated. Matches against employee skill profiles.</p>
      </div>
      <div class="form-group">
        <label for="attachments">Attachments</label>
        <input type="file" id="attachments" name="attachments" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.csv,.txt,.jpg,.jpeg,.png,.gif,.webp" aria-describedby="attachments-hint" />
        <p class="form-hint" id="attachments-hint">Documents and images only. Max 25MB per file.</p>
      </div>
      <button type="submit" class="btn btn-primary">Create Posting</button>
    </form>
  </div>
</div>
{{end}}

{{template "base" .}}
