{{define "title"}}Assign Managers{{end}}

{{define "content"}}
<style>
.orgchart-assign-layout { max-width: 960px; margin: 0 auto; }
.orgchart-assign-layout .form-hint { color: #56687a; font-size: 0.9em; margin-top: -8px; margin-bottom: 14px; }
</style>
<div class="orgchart-assign-layout">
    <div class="profile-card">
        <h2>Assign Managers</h2>
        {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
        <form method="POST" action="/admin/orgchart">
            <div class="form-group">
                <label for="employee_id">Employee</label>
                <select id="employee_id" name="employee_id" required>
                    <option value="">Select an employee…</option>
                    {{range .Users}}
                    <option value="{{.ID}}">{{.Name}}</option>
                    {{end}}
                </select>
            </div>
            <div class="form-group">
                <label for="manager_id">Reports To (Manager)</label>
                <select id="manager_id" name="manager_id">
                    <option value="">No manager (top of chart)</option>
                    {{range .Users}}
                    <option value="{{.ID}}">{{.Name}}</option>
                    {{end}}
                </select>
            </div>
            <p class="form-hint">An employee cannot be their own manager. Choosing "No manager" places them at the top of the chart.</p>
            <button type="submit" class="btn btn-primary">Save Reporting Relationship</button>
        </form>
        <a href="/orgchart" class="back-link" style="display:inline-block;margin-top:16px;">← Back to Org Chart</a>
    </div>
</div>
{{end}}

{{template "base" .}}
