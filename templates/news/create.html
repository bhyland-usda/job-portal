{{define "title"}}Write Article{{end}}

{{define "content"}}
<div class="news-layout">
    <div class="profile-card">
        <h2>Write Article</h2>
        {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
        <form method="POST" action="/news/create">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required>
            </div>
            <div class="form-group">
                <label for="content">Content</label>
                <textarea id="content" name="content" rows="12" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Create Article</button>
        </form>
        <a href="/news" class="back-link" style="display:inline-block;margin-top:16px;"><span aria-hidden="true">←</span> Back to News</a>
    </div>
</div>
{{end}}

{{template "base" .}}
