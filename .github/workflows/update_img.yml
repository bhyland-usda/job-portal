# Only allow manual triggering through the GitHub UI
on:
    workflow_dispatch:

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            # Checkout the repository
            - name: Checkout repository
              uses: actions/checkout@4
        
        # Log into GitHub Container Registry (GHCR)
        - name: Log into GHCR
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GH_TOKEN }}

        # Build the Docker image
        - name: Build Docker image
          run: |
            docker build -t ghcr.io/${{ github.repository_owner }}/talent-market-dev:latest .
        
        # Push the Docker image to GHCR
        - name: Push Docker image
          run: |
            docker push ghcr.io/${{ github.repository_owner }}/talent-market-dev:latest