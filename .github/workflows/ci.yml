name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    go-unit:
        name: Go Unit Tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                go-version-file: go.mod
                cache: true

            - name: Download modules
              run: go mod download

            - name: Vet
              run: go vet ./...

            - name: Test
              run: go test -race ./...

    playwright-unittests:
        name: Python Playwright Surface Tests
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                go-version-file: go.mod
                cache: true

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"
            
            - name: Setup uv
              uses: astral-sh/setup-uv@v6
              with:
                enable-cache: true
            
            - name: Install Python dependencies
              run: uv sync

            - name: Install Playwright Chromium
              run: uv run playwright install --with-deps chromium

            - name: Run browser tests
              run: bash scripts/run-playwright-tests.sh