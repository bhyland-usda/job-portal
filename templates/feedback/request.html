{{define "title"}}Request Feedback from {{.ReceiverName}}{{end}}

{{define "content"}}
<div class="feedback-layout">
  <div class="profile-card">
    <h2>Request Feedback from {{.ReceiverName}}</h2>

    {{if .Error}}
    <div class="alert alert-error">{{.Error}}</div>
    {{end}}

    <form method="POST" action="/feedback-ask/{{.ReceiverID}}">
      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" required placeholder="e.g. Q1 Performance Review, Project Collaboration" />
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Send Request</button>
        <a href="/profile/{{.ReceiverID}}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{{end}}

{{template "base" .}}
