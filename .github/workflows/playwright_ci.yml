name: Browser CI

on:
    pull_request:
        paths:
            - cmd/bots/**
            - tests/**
            - scripts/run-playwright-tests.sh
            - pyproject.toml
            - go.mod
            - go.sum
    workflow_dispatch:

permissions:
    contents: read

jobs:
    playwright-unittests:
        name: Python Playwright Surface Tests
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                go-version-file: go.mod
                cache: true

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"
            
            - name: Setup uv
              uses: astral-sh/setup-uv@v6
              with:
                enable-cache: true
            
            - name: Install Python dependencies
              run: uv sync

            - name: Install Playwright Chromium
              run: uv run playwright install --with-deps chromium

            - name: Run browser tests
              run: bash scripts/run-playwright-tests.sh